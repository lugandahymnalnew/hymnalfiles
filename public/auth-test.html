<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System Test</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --panel: #ffffff;
            --ink: #1a1a1a;
            --muted: #666;
            --accent: #0f766e;
            --success: #1d7a44;
            --danger: #9f2f26;
            --line: #e0e0e0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--panel);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 { margin: 0 0 20px; font-size: 1.5rem; }
        h2 { margin: 0 0 16px; font-size: 1.2rem; }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            background: #fce9e8;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--ink);
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        .status.success {
            background: #e8f6ed;
            color: var(--success);
        }

        .status.error {
            background: #fce9e8;
            color: var(--danger);
        }

        .status.info {
            background: #fff6d8;
            color: #785b00;
        }

        pre {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(15, 118, 110, 0.12);
            color: var(--accent);
        }

        .log-entry {
            padding: 8px;
            border-bottom: 1px solid var(--line);
            font-size: 0.85rem;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--muted);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Auth System Test</h1>
            <p style="color: var(--muted); margin: 0;">Test the JWT authentication with refresh tokens</p>
        </div>

        <div class="card">
            <h2>Login</h2>
            <div class="grid">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="loginUser" placeholder="Enter username or email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" placeholder="Enter password">
                </div>
            </div>
            <button class="btn-primary" onclick="testLogin()">Login</button>
            <div id="loginStatus"></div>
        </div>

        <div class="card">
            <h2>Current Session</h2>
            <div id="sessionInfo">
                <p style="color: var(--muted);">No active session. Login to see session details.</p>
            </div>
            <div style="margin-top: 16px;">
                <button class="btn-secondary" onclick="showTokens()">Show Tokens</button>
                <button class="btn-secondary" onclick="refreshToken()">Refresh Token</button>
                <button class="btn-danger" onclick="logout()">Logout</button>
                <button class="btn-danger" onclick="logoutAll()">Logout All Sessions</button>
            </div>
            <div id="tokenInfo"></div>
        </div>

        <div class="card">
            <h2>API Test</h2>
            <button class="btn-secondary" onclick="testMe()">GET /api/auth/me</button>
            <button class="btn-secondary" onclick="testAdminUsers()">GET /api/admin/users</button>
            <div id="apiStatus"></div>
        </div>

        <div class="card">
            <h2>Activity Log</h2>
            <div id="log"></div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);

            // Keep only last 50 entries
            while (logDiv.children.length > 50) {
                logDiv.removeChild(logDiv.lastChild);
            }
        }

        function showStatus(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function testLogin() {
            const userName = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;

            if (!userName || !password) {
                showStatus('loginStatus', 'Please enter username and password', 'error');
                return;
            }

            log('Attempting login...');
            const result = await auth.login(userName, password);

            if (result.success) {
                showStatus('loginStatus', `Login successful! Welcome ${result.user.userName}`, 'success');
                log(`Login successful: ${result.user.userName} (${result.user.role})`);
                updateSessionInfo();
            } else {
                showStatus('loginStatus', `Login failed: ${result.error}`, 'error');
                log(`Login failed: ${result.error}`);
            }
        }

        function updateSessionInfo() {
            const user = auth.getCurrentUser();
            const isLoggedIn = auth.isLoggedIn();
            const isAdmin = auth.isAdmin();
            const accessToken = auth.getAccessToken();
            const refreshToken = auth.getRefreshToken();

            const sessionDiv = document.getElementById('sessionInfo');

            if (!isLoggedIn || !user) {
                sessionDiv.innerHTML = '<p style="color: var(--muted);">No active session.</p>';
                return;
            }

            sessionDiv.innerHTML = `
                <div style="margin-bottom: 12px;">
                    <strong>${user.fullName || user.userName}</strong>
                    <span class="badge" style="margin-left: 8px;">${user.role}</span>
                    <span class="badge" style="margin-left: 4px;">${user.status}</span>
                </div>
                <div style="font-size: 0.9rem; color: var(--muted);">
                    <div>Email: ${user.email}</div>
                    <div>Has Access Token: ${!!accessToken}</div>
                    <div>Has Refresh Token: ${!!refreshToken}</div>
                    <div>Is Admin: ${isAdmin}</div>
                </div>
            `;
        }

        function showTokens() {
            const accessToken = auth.getAccessToken();
            const refreshToken = auth.getRefreshToken();

            let html = '<pre>';
            if (accessToken) {
                try {
                    const payload = JSON.parse(atob(accessToken.split('.')[1]));
                    html += '<strong>Access Token Payload:</strong>\n' + JSON.stringify(payload, null, 2) + '\n\n';
                } catch (e) {
                    html += 'Access Token: (could not decode)\n';
                }
            }
            if (refreshToken) {
                html += '<strong>Refresh Token:</strong> ' + refreshToken.substring(0, 50) + '...\n';
            }
            html += '</pre>';

            document.getElementById('tokenInfo').innerHTML = html;
            log('Displayed token information');
        }

        async function refreshToken() {
            log('Refreshing access token...');
            const result = await auth.refreshAccessToken();

            if (result.success) {
                showStatus('tokenInfo', 'Token refreshed successfully', 'success');
                log('Token refreshed successfully');
            } else {
                showStatus('tokenInfo', `Refresh failed: ${result.error}`, 'error');
                log(`Token refresh failed: ${result.error}`);
            }
        }

        async function logout() {
            log('Logging out...');
            await auth.logout();
            showStatus('loginStatus', 'Logged out successfully', 'success');
            showStatus('tokenInfo', '');
            document.getElementById('sessionInfo').innerHTML = '<p style="color: var(--muted);">No active session.</p>';
            log('Logged out');
        }

        async function logoutAll() {
            if (!confirm('Logout from all sessions?')) return;
            log('Logging out from all sessions...');
            await auth.logoutAll();
            showStatus('loginStatus', 'Logged out from all sessions', 'success');
            showStatus('tokenInfo', '');
            document.getElementById('sessionInfo').innerHTML = '<p style="color: var(--muted);">No active session.</p>';
            log('Logged out from all sessions');
        }

        async function testMe() {
            log('Testing /api/auth/me...');
            try {
                const response = await auth.apiRequest('/api/auth/me');
                const data = await response.json();

                if (response.ok && data.success) {
                    showStatus('apiStatus', `Success! User: ${data.user.userName}`, 'success');
                    log(`/api/auth/me: ${data.user.userName}`);
                } else {
                    showStatus('apiStatus', `Error: ${data.message}`, 'error');
                    log(`/api/auth/me failed: ${data.message}`);
                }
            } catch (error) {
                showStatus('apiStatus', `Error: ${error.message}`, 'error');
                log(`/api/auth/me error: ${error.message}`);
            }
        }

        async function testAdminUsers() {
            log('Testing /api/admin/users...');
            try {
                const response = await auth.apiRequest('/api/admin/users');
                const data = await response.json();

                if (response.ok && data.success) {
                    showStatus('apiStatus', `Success! Found ${data.data ? data.data.length : 0} users`, 'success');
                    log(`/api/admin/users: ${data.data ? data.data.length : 0} users`);
                } else {
                    showStatus('apiStatus', `Error: ${data.message}`, 'error');
                    log(`/api/admin/users failed: ${data.message}`);
                }
            } catch (error) {
                showStatus('apiStatus', `Error: ${error.message}`, 'error');
                log(`/api/admin/users error: ${error.message}`);
            }
        }

        // Initialize
        log('Auth test page loaded');
        if (auth.isLoggedIn()) {
            log('Already logged in as ' + (auth.getCurrentUser()?.userName || 'unknown'));
            updateSessionInfo();
        }
    </script>
</body>
</html>
