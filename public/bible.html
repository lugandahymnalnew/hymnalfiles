<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible | Ennyimba Za Kristo</title>
    <style>
        :root {
            --bg: #f3efe7;
            --panel: #fffdf8;
            --ink: #1d2a2f;
            --muted: #607078;
            --accent: #0f766e;
            --accent-strong: #0b5b55;
            --gold: #b58538;
            --line: rgba(22, 40, 48, 0.12);
            --shadow: 0 18px 40px rgba(28, 40, 44, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 28%),
                radial-gradient(circle at bottom right, rgba(181, 138, 69, 0.14), transparent 30%),
                linear-gradient(180deg, #f8f4ec 0%, #efe8dc 100%);
        }

        header.top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 20px;
            position: sticky;
            top: 0;
            background: rgba(248, 244, 236, 0.94);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
            z-index: 20;
        }

        .top-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.92rem;
            white-space: nowrap;
        }

        .top-link:hover { color: var(--accent); }

        .search-form {
            flex: 1;
            max-width: 420px;
            display: flex;
            gap: 8px;
        }

        .search-form input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 0.92rem;
        }

        .search-form input:focus {
            outline: none;
            border-color: rgba(15, 118, 110, 0.55);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }

        .search-form button {
            border: none;
            border-radius: 999px;
            padding: 9px 16px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        .picker-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .picker-row select {
            flex: 1;
            min-width: 140px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.95rem;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.85);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 22px;
        }

        .chapter-title {
            margin: 0 0 16px;
            font-size: 1.3rem;
        }

        .verse {
            line-height: 1.8;
            font-size: 1.02rem;
        }

        .verse .vnum {
            font-weight: 700;
            color: var(--accent);
            margin-right: 4px;
            font-size: 0.82rem;
            vertical-align: super;
        }

        .search-results {
            display: grid;
            gap: 12px;
        }

        .search-result {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.85);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .search-result:hover {
            border-color: rgba(15, 118, 110, 0.35);
        }

        .search-result .ref {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.88rem;
            margin-bottom: 4px;
        }

        .search-result mark {
            background: rgba(181, 133, 56, 0.28);
            color: inherit;
            padding: 0 2px;
            border-radius: 3px;
        }

        .empty, .loading {
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons button {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .nav-buttons button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 560px) {
            .search-form { display: none; }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <a class="top-link" href="/index.html">&#8249; Home</a>
        <form class="search-form" id="searchForm">
            <input type="text" id="searchInput" placeholder="Search the Bible (Luganda)...">
            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <div class="picker-row">
            <select id="bookSelect"></select>
            <select id="chapterSelect"></select>
        </div>

        <div id="content" class="panel">
            <div class="loading">Loading...</div>
        </div>
    </main>

    <script src="js/bible.js" defer></script>
</body>
</html>
